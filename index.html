<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家族の予定</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家族の予定">
<meta name="theme-color" content="#f0f5f9">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f0f5f9; --panel:#fff; --panel2:#f5f9fc; --line:#e3ecf3; --line2:#eff5f9;
    --ink:#152838; --ink2:#3b5468; --sub:#7a92a6;
    --accent:#2f8fd6; --accent-dark:#1d72b4; --accent-soft:#e6f2fc;
    --green:#2eb489; --green-soft:#e2f7f0;
    --orange:#f0973c; --orange-soft:#fff3e4;
    --red:#e2705f;
    --c-me:#2f8fd6; --c-mom:#f2833f; --c-sis:#8a6fd6;
    --r:18px; --r2:13px;
    --sh:0 2px 10px rgba(20,60,95,.07);
    --sh2:0 10px 28px rgba(20,60,95,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.6;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:840px; margin:0 auto; padding:0 12px;}

  /* ========== 家族写真 ========== */
  .famtop{padding:12px 0 4px;}
  .famtop img{
    width:100%; display:block; border-radius:var(--r);
    box-shadow:0 10px 26px rgba(20,60,95,.18);
  }
  .fam-cap{
    text-align:center; font-size:11.5px; color:var(--sub);
    font-weight:700; margin-top:7px; letter-spacing:.03em;
  }

  .reload-b{
    background:var(--panel2); border:2px solid var(--line); color:var(--accent);
    width:40px; height:40px; border-radius:50%; font-size:20px; font-weight:900;
    flex-shrink:0;
  }
  .reload-b:active{transform:scale(.9);}
  .reload-b.spin{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ========== 上部 ========== */
  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 0 10px; margin-top:10px; border-radius:var(--r) var(--r) 0 0;
    box-shadow:0 1px 8px rgba(20,60,95,.05);
  }
  .top-in{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .today-str{font-size:19px; font-weight:900; letter-spacing:.01em;}
  .today-str small{font-size:12px; color:var(--sub); font-weight:800; margin-left:6px;}
  .top-fam{display:flex;}
  .top-fam img{
    width:30px; height:30px; border-radius:50%; object-fit:cover;
    border:2.5px solid var(--panel); margin-left:-9px;
  }
  .top-fam img:first-child{margin-left:0;}

  /* 日付の切り替え（きょう / あした） */
  .daysw{display:flex; gap:8px; margin:12px 0 0;}
  .daysw button{
    flex:1; border:none; border-radius:999px; padding:12px 0;
    font-size:15px; font-weight:900; background:var(--panel2); color:var(--sub);
    border:2px solid transparent; transition:.18s;
  }
  .daysw button.on{background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(47,143,214,.32);}
  .daysw button small{display:block; font-size:10.5px; font-weight:700; opacity:.8; margin-top:1px;}

  /* ========== ボード ========== */
  .board{margin-top:14px;}
  .board-ttl{
    display:flex; align-items:baseline; gap:9px; margin:0 2px 9px;
  }
  .board-ttl h2{font-size:17px; margin:0; font-weight:900;}
  .board-ttl span{font-size:12px; color:var(--sub); font-weight:800;}

  .cols{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .col{
    background:var(--panel); border-radius:var(--r);
    border:2px solid var(--line); overflow:hidden; box-shadow:var(--sh);
    display:flex; flex-direction:column;
  }
  .col.done{border-color:#b9e8d6; background:linear-gradient(180deg,#f2fcf8,#fff);}
  .col-head{
    padding:11px 6px 9px; text-align:center; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .col.me   .col-head{background:linear-gradient(135deg,#2f8fd6,#57b4ec);}
  .col.mom  .col-head{background:linear-gradient(135deg,#f2833f,#f7a86b);}
  .col.sis  .col-head{background:linear-gradient(135deg,#8a6fd6,#a892e6);}
  .col-head img{width:44px; height:44px; border-radius:50%; object-fit:cover;
    border:3px solid rgba(255,255,255,.85);}
  .col-name{font-size:14px; font-weight:900;}
  .col-badge{
    font-size:11px; font-weight:900; background:rgba(255,255,255,.26);
    border-radius:999px; padding:3px 10px;
  }
  .col-badge.ok{background:#fff; color:var(--green);}
  .col-body{padding:8px 7px 10px; flex:1; display:flex; flex-direction:column; gap:6px;}

  .slot{margin-top:4px;}
  .slot-l{
    font-size:10px; font-weight:900; color:var(--sub); letter-spacing:.08em;
    padding:0 3px 4px; display:flex; align-items:center; gap:4px;
  }
  .slot-l i{font-size:12px;}

  .card{
    background:var(--panel2); border:1.5px solid var(--line);
    border-left:5px solid var(--c); border-radius:11px;
    padding:9px 8px; margin-bottom:6px; text-align:left; width:100%;
    display:flex; flex-direction:column; gap:3px;
    transition:transform .12s, background .18s, opacity .18s;
  }
  .card:active{transform:scale(.95);}
  .card .ct{font-size:12.5px; font-weight:800; line-height:1.4; color:var(--ink);}
  .card .cm{font-size:10.5px; font-weight:800; color:var(--sub);}
  .card.fin{background:var(--green-soft); border-color:#c4ecdd; opacity:.72;}
  .card.fin .ct{text-decoration:line-through; color:var(--sub);}
  .card.rest{background:var(--orange-soft); border-color:#f6d6ac;}
  .card.rest .ct{color:#b8722c;}
  .card-check{
    align-self:flex-end; width:22px; height:22px; border-radius:7px;
    border:2px solid #cbdae5; background:#fff; margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:900; color:transparent;
  }
  .card.fin .card-check{background:var(--green); border-color:var(--green); color:#fff;}
  .card.rest .card-check{background:var(--orange); border-color:var(--orange); color:#fff;}
  .col-empty{
    text-align:center; color:#b5c6d3; font-size:11.5px; font-weight:800;
    padding:18px 4px;
  }
  .col-clear{
    text-align:center; color:var(--green); font-size:12px; font-weight:900;
    padding:14px 4px 10px;
  }
  .col-clear .em{display:block; font-size:26px; margin-bottom:3px;}

  /* ========== 追加ボタン ========== */
  .addbig{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(76px + env(safe-area-inset-bottom));
    background:linear-gradient(135deg,#2f8fd6,#4aa8e6); color:#fff;
    border:none; border-radius:999px; padding:15px 30px;
    font-size:16.5px; font-weight:900; z-index:45;
    box-shadow:0 10px 26px rgba(47,143,214,.45);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .addbig:active{transform:translateX(-50%) scale(.95);}

  /* ========== 下部ナビ ========== */
  .nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,.97); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .nav button{
    flex:1; background:none; border:none; padding:7px 0 5px;
    color:var(--sub); font-size:11px; font-weight:900;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .nav button i{font-size:21px; font-style:normal; line-height:1;}
  .nav button.on{color:var(--accent);}

  /* ========== 入力シート ========== */
  .sheet{
    position:fixed; inset:0; z-index:120; display:flex; align-items:flex-end;
    background:rgba(15,35,55,0); transition:background .3s; pointer-events:none;
  }
  .sheet.show{background:rgba(15,35,55,.55); pointer-events:auto;}
  .sheet-in{
    width:100%; max-width:640px; margin:0 auto; background:var(--panel);
    border-radius:26px 26px 0 0; padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .38s cubic-bezier(.2,1,.3,1);
    max-height:92vh; overflow-y:auto;
  }
  .sheet.show .sheet-in{transform:translateY(0);}
  .grip{width:44px; height:5px; border-radius:99px; background:#dbe6ee; margin:6px auto 14px;}
  .sh-step{font-size:12px; font-weight:900; color:var(--accent); letter-spacing:.1em;}
  .sh-q{font-size:20px; font-weight:900; margin:3px 0 14px;}

  .pick-fam{display:flex; gap:10px; margin-bottom:6px;}
  .pick-fam button{
    flex:1; background:var(--panel2); border:2.5px solid var(--line);
    border-radius:var(--r); padding:14px 6px 12px;
    display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .pick-fam button img{width:56px; height:56px; border-radius:50%; object-fit:cover;
    border:3px solid #fff; box-shadow:var(--sh);}
  .pick-fam button span{font-size:15px; font-weight:900; color:var(--ink2);}
  .pick-fam button:active{transform:scale(.96);}
  .pick-fam button.on{background:var(--accent-soft); border-color:var(--accent);}
  .pick-fam button.on span{color:var(--accent-dark);}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .chip{
    background:var(--panel2); border:2px solid var(--line); border-radius:999px;
    padding:11px 16px; font-size:14.5px; font-weight:800; color:var(--ink2);
  }
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.datepick{position:relative; overflow:hidden;}
  .chip.datepick input{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;
  }
  .chip.big{font-size:15.5px; padding:13px 20px;}

  .range-box{
    background:var(--panel2); border:2px solid var(--accent); border-radius:14px;
    padding:13px; margin-bottom:14px;
  }
  .range-line{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .range-line:last-child{margin-bottom:0;}
  .range-l{font-size:12.5px; font-weight:900; color:var(--sub); width:38px; flex-shrink:0;}
  .range-line b{font-size:15px; font-weight:900;}
  .range-line .datebox{flex:1; font-size:14.5px; margin:0;}
  .range-cnt{
    margin-top:10px; text-align:center; font-size:13px; font-weight:900;
    color:var(--accent-dark); background:var(--accent-soft);
    border-radius:10px; padding:8px;
  }
  .sh-input{
    width:100%; background:var(--panel2); border:2px solid var(--line);
    border-radius:14px; padding:15px 15px; font-size:17px; font-weight:700;
    color:var(--ink); margin-bottom:14px;
  }
  .tp{background:var(--panel2); border:2px solid var(--line); border-radius:14px;
    padding:11px; margin-bottom:12px;}
  .tp-l{font-size:12.5px; font-weight:900; color:var(--sub); margin-bottom:8px;
    display:flex; align-items:center; gap:8px;}
  .tp-l b{font-size:17px; color:var(--accent-dark);}
  .tp-clr{margin-left:auto; background:#fff; border:1.5px solid var(--line);
    border-radius:8px; padding:4px 11px; font-size:11.5px; font-weight:800;
    color:var(--sub);}
  .tp-h{display:grid; grid-template-columns:repeat(6,1fr); gap:5px;}
  .tp-m{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:7px;
    padding-top:8px; border-top:1px solid var(--line);}
  .tp-b{background:#fff; border:2px solid var(--line); border-radius:10px;
    padding:11px 0; font-size:15px; font-weight:900; color:var(--ink2);}
  .tp-b:active{transform:scale(.93);}
  .tp-b.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tp-b.m{font-size:13.5px;}
  .sh-row{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .sh-row .sh-input{margin:0;}
  .sh-lbl{font-size:13px; font-weight:900; color:var(--sub); margin:0 0 8px;}
  .sh-btn{
    width:100%; background:linear-gradient(135deg,#2f8fd6,#4aa8e6); color:#fff;
    border:none; border-radius:16px; padding:17px; font-size:17px; font-weight:900;
    box-shadow:0 8px 22px rgba(47,143,214,.4); margin-top:4px;
  }
  .sh-btn:active{transform:scale(.97);}
  .sh-btn.sub{background:none; color:var(--sub); box-shadow:none; font-size:14.5px;
    padding:13px; margin-top:2px;}
  .sh-back{
    background:none; border:none; color:var(--sub); font-size:14px; font-weight:800;
    padding:6px 0 12px;
  }

  /* ========== 詳細シート（タスクを押した時） ========== */
  .det-t{font-size:21px; font-weight:900; margin:2px 0 3px; line-height:1.35;}
  .det-s{font-size:13px; color:var(--sub); font-weight:800; margin-bottom:18px;}
  .det-btns{display:flex; flex-direction:column; gap:9px;}
  .det-b{
    border:none; border-radius:16px; padding:17px; font-size:16.5px; font-weight:900;
    display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .det-b.done{background:var(--green); color:#fff; box-shadow:0 8px 20px rgba(46,180,137,.35);}
  .det-b.undone{background:var(--panel2); color:var(--ink2); border:2px solid var(--line);}
  .det-b.rest{background:var(--orange-soft); color:#b8722c; border:2px solid #f6d6ac;}
  .det-b.edit{background:var(--accent-soft); color:var(--accent-dark);
    border:2px solid #cbe4f8;}
  .det-b.calsw{background:var(--panel2); color:var(--sub); border:2px solid var(--line);
    font-size:14.5px; padding:14px;}
  .det-b.calsw.on{background:var(--green-soft); color:#1c8e69; border-color:#b9e8d6;}
  .det-b.del{background:none; color:var(--red); font-size:14.5px; padding:12px;}
  .det-b:active{transform:scale(.97);}

  /* ========== カレンダー ========== */
  .cal-wrap{background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r); padding:14px 6px; margin-top:14px; box-shadow:var(--sh);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; align-items:start;}
  .cal-head{font-size:11px; color:var(--sub); text-align:center; padding:3px 0 6px; font-weight:900;}
  .cal-head.sun{color:var(--red);} .cal-head.sat{color:var(--accent);}
  .cal-cell{
    min-height:132px; background:var(--panel2); border:2px solid transparent;
    border-radius:11px; padding:5px 3px; display:flex; flex-direction:column; gap:3px;
    overflow:hidden;
  }
  .cal-cell.empty{background:transparent; min-height:0; border:none;}
  .cal-cell.today{border-color:var(--accent); background:#e9f4fd;}
  .cal-cell.sel{border-color:var(--accent-dark); background:var(--accent-soft);}
  .cal-cell.cleared{background:var(--green-soft);}
  .cell-top{display:flex; align-items:center; justify-content:space-between;}
  .cal-cell .cd{font-size:13px; font-weight:900; color:var(--ink2);}
  .cal-cell.today .cd{color:var(--accent);}
  .cell-dots{display:flex; gap:3px;}
  .md{display:flex; align-items:center; gap:1px;}
  .md i{width:6px; height:6px; border-radius:50%;}
  .md b{font-size:9px; font-weight:900; color:var(--ink2);}
  .md b.ok{color:var(--green);} .md b.off{color:#c6d5e0;}
  .ev-list{display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .ev-chip{
    background:#fff; border-radius:6px; padding:2px 4px 2px 5px;
    border-left:3.5px solid var(--c); font-size:9.5px; line-height:1.35;
    color:var(--ink2); font-weight:800; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; box-shadow:0 1px 3px rgba(20,60,95,.07);
  }
  .ev-chip.done{opacity:.4; text-decoration:line-through; box-shadow:none;}
  .ev-more{font-size:9px; color:var(--accent); padding:2px; font-weight:900;
    background:var(--accent-soft); border-radius:6px; text-align:center;}
  .cal-legend{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin-top:12px; font-size:11px; color:var(--sub); font-weight:800;}
  .cal-legend span{display:flex; align-items:center; gap:5px;}
  .legend-face{width:19px; height:19px; border-radius:50%; object-fit:cover;
    border:2px solid var(--line);}

  /* ========== 予定一覧 ========== */
  .ag-day{
    display:flex; gap:12px; padding:11px 4px; border-top:1px solid var(--line2);
    align-items:flex-start;
  }
  .ag-day:first-of-type{border-top:none;}
  .ag-day.today{background:#eef7fe; border-radius:12px; padding:11px 8px;}
  .ag-date{width:34px; flex-shrink:0; text-align:center;}
  .ag-d{font-size:19px; font-weight:900; line-height:1;}
  .ag-day.today .ag-d{color:var(--accent);}
  .ag-w{font-size:10px; font-weight:800; color:var(--sub); margin-top:2px;}
  .ag-w.sun{color:var(--red);} .ag-w.sat{color:var(--accent);}
  .ag-list{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .ag-row{display:flex; align-items:center; gap:8px; min-width:0;}
  .ag-face{width:24px; height:24px; border-radius:50%; object-fit:cover;
    border:2px solid var(--line); flex-shrink:0;}
  .ag-tm{font-size:11.5px; font-weight:900; color:var(--accent-dark);
    background:var(--accent-soft); padding:2px 7px; border-radius:6px; flex-shrink:0;}
  .ag-tx{font-size:14px; font-weight:800; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;}
  .ag-row.done .ag-tx{color:var(--sub); text-decoration:line-through;}
  .ag-row.done .ag-face{opacity:.5;}

  /* ========== じぶん（数字） ========== */
  .mine-sec{background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r); padding:17px; margin-top:14px; box-shadow:var(--sh);}
  .mine-ttl{font-size:15px; font-weight:900; margin:0 0 14px;
    display:flex; align-items:center; gap:7px;}
  .mine-ttl small{font-size:11.5px; color:var(--sub); font-weight:700; margin-left:auto;}
  .pace-box{background:linear-gradient(135deg,#eaf4fd,#f4faff); border:1px solid #d5e8f7;
    border-radius:var(--r2); padding:14px 15px; margin-bottom:12px;}
  .pace-msg{font-size:13px; font-weight:800; color:var(--ink2);}
  .pace-msg b{font-size:19px; font-weight:900; color:var(--accent-dark);}
  .pace-bar{height:8px; background:#d9e9f6; border-radius:99px; margin-top:10px; overflow:hidden;}
  .pace-fill{height:100%; background:linear-gradient(90deg,var(--accent),#68bdf0);
    border-radius:99px; transition:width .35s;}
  .goal-strip{display:flex; gap:9px;}
  .goal-card{flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line);
    border-radius:var(--r2); padding:12px 11px;}
  .goal-card .label{font-size:10.5px; color:var(--sub); font-weight:800;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .goal-card .value{font-size:17px; font-weight:900; margin-top:4px;}
  .goal-card.uber .value{color:var(--accent);}
  .goal-card.eigyou .value{color:var(--c-sis);}
  .goal-card.total .value{color:var(--green);}
  .goal-card .sub{font-size:10.5px; color:var(--sub); margin-top:3px; font-weight:700;}
  .goal-card .sub.remain{color:var(--red); font-weight:900;}
  .goal-card .sub.remain.achieved{color:var(--green);}
  .goal-card .sub.pace{color:var(--accent); font-weight:900; margin-top:5px;
    background:#fff; border-radius:7px; padding:3px 7px; display:inline-block;}
  .rec-row{margin-top:12px;}
  .rec-row.two{display:flex; gap:10px;}
  .rec-row.two > div{flex:1;}
  .rec-lbl{font-size:12.5px; color:var(--sub); font-weight:800; display:block; margin-bottom:6px;}
  .rec-in{width:100%; background:var(--panel2); border:2px solid var(--line);
    border-radius:12px; padding:13px; font-size:17px; font-weight:800; color:var(--ink);}
  .datenav{display:flex; align-items:center; gap:8px;}
  .datenav button{
    background:var(--panel2); border:2px solid var(--line); color:var(--accent);
    width:44px; height:44px; border-radius:12px; font-size:20px; font-weight:900;
    flex-shrink:0;
  }
  .datenav button:active{transform:scale(.94);}
  .datebox{
    flex:1; position:relative; overflow:hidden;
    background:var(--panel2); border:2px solid var(--line); border-radius:12px;
    padding:12px; text-align:center; font-size:16px; font-weight:900;
    color:var(--ink); cursor:pointer;
  }
  .datebox input{position:absolute; inset:0; opacity:0; width:100%; height:100%;}
  .bulk-row{display:flex; align-items:center; gap:11px; padding:11px 2px;
    border-bottom:1px solid var(--line2);}
  .bulk-row:last-child{border-bottom:none;}
  .bulk-face{width:34px; height:34px; border-radius:50%; object-fit:cover;
    border:2px solid var(--line); flex-shrink:0;}
  .bulk-info{flex:1; min-width:0;}
  .bulk-t{font-size:14.5px; font-weight:900; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .bulk-s{font-size:11.5px; color:var(--sub); font-weight:700; margin-top:2px;}
  .bulk-del{background:#fdecea; border:2px solid #f5c6c0; color:var(--red);
    border-radius:10px; padding:9px 15px; font-size:13.5px; font-weight:900;
    flex-shrink:0;}
  .bulk-del:active{transform:scale(.94);}
  .rec-hint{font-size:12px; color:var(--sub); margin-top:8px; font-weight:700;}
  .ramen-row{display:flex; align-items:center; gap:12px; background:var(--panel2);
    border:2px solid var(--line); border-radius:var(--r2); padding:14px; margin-top:12px;}
  .ramen-row.on{background:var(--orange-soft); border-color:var(--orange);}
  .ramen-ico{font-size:24px;}
  .ramen-txt{flex:1;}
  .ramen-t{font-size:14px; font-weight:900;}
  .ramen-row.on .ramen-t{color:#c9762a;}
  .ramen-s{font-size:11.5px; color:var(--sub); font-weight:700; margin-top:2px;}
  .ramen-sw{width:52px; height:30px; border-radius:99px; background:#cdd9e2; position:relative;}
  .ramen-sw.on{background:var(--orange);}
  .ramen-sw span{position:absolute; top:3px; left:3px; width:24px; height:24px;
    border-radius:50%; background:#fff; transition:transform .22s;
    box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .ramen-sw.on span{transform:translateX(22px);}
  .member-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .member-face{width:32px; height:32px; border-radius:50%; object-fit:cover;
    border:2.5px solid var(--line);}
  .member-name{font-size:13px; width:56px; font-weight:900;}
  .member-bar-wrap{flex:1; height:22px; background:var(--line2); border-radius:99px; overflow:hidden;}
  .member-bar{height:100%; border-radius:99px; transition:width .3s;}
  .member-val{font-size:12px; width:88px; text-align:right; font-weight:900;}
  .bar-chart{display:flex; align-items:flex-end; gap:2px; height:110px; padding-top:8px;}
  .bar-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%;}
  .bar{width:100%; border-radius:3px 3px 0 0; min-height:2px;}
  .bar-label{font-size:7.5px; color:var(--sub); margin-top:4px; font-weight:700;}
  .stat-grid{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{flex:1 1 44%; background:var(--panel2); border-radius:var(--r2); padding:13px;}
  .stat .l{font-size:11px; color:var(--sub); font-weight:800;}
  .stat .v{font-size:20px; font-weight:900; margin-top:4px;}

  .status{text-align:center; color:var(--sub); font-size:13.5px; padding:44px; font-weight:800;}
  .foot{text-align:center; color:var(--sub); font-size:12px; margin:22px 0; font-weight:700;}
  .mon-nav{display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:14px;}
  .mon-nav button{background:var(--panel); border:1px solid var(--line); color:var(--accent);
    width:38px; height:38px; border-radius:50%; font-size:19px; font-weight:900;
    box-shadow:var(--sh);}
  .mon-nav select{background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:9px 16px; font-size:15px; font-weight:900;
    color:var(--ink); box-shadow:var(--sh); -webkit-appearance:none; appearance:none;}

  /* ポップアップ・おみくじ（既存） */
  .pop{position:fixed; inset:0; z-index:200; display:flex; align-items:center;
    justify-content:center; padding:14px; background:rgba(16,34,52,0);
    backdrop-filter:blur(0); transition:background .38s, backdrop-filter .38s;
    pointer-events:none;}
  .pop.show{background:rgba(16,34,52,.68); backdrop-filter:blur(7px);}
  .pop-card{position:relative; width:100%; max-width:520px; background:#fff;
    border-radius:26px; overflow:hidden; box-shadow:0 30px 80px rgba(10,30,50,.5);
    transform:translateY(46px) scale(.84) rotate(-2.5deg); opacity:0;
    transition:transform .55s cubic-bezier(.16,1.34,.36,1), opacity .34s;}
  .pop.show .pop-card{transform:translateY(0) scale(1) rotate(0); opacity:1;}
  .pop-photo{width:100%; max-height:64vh; aspect-ratio:1/1; object-fit:cover; display:block;
    animation:kb 7s ease-out forwards;}
  @keyframes kb{from{transform:scale(1.12);} to{transform:scale(1);}}
  .pop-body{position:absolute; left:0; right:0; bottom:0; padding:56px 22px 24px;
    background:linear-gradient(180deg,transparent,rgba(8,22,36,.62) 40%,rgba(8,22,36,.93));
    text-align:center; color:#fff;}
  .pop-title{font-size:24px; font-weight:900; margin-bottom:7px;
    text-shadow:0 3px 16px rgba(0,0,0,.75); opacity:0;
    transform:translateY(16px) scale(.94);
    animation:ri .55s .24s cubic-bezier(.2,1.4,.4,1) forwards;}
  .pop-sub{font-size:13.5px; color:#e4edf3; line-height:1.65; font-weight:700;
    text-shadow:0 1px 10px rgba(0,0,0,.8); opacity:0; transform:translateY(14px);
    animation:ri .5s .4s forwards;}
  @keyframes ri{to{opacity:1; transform:translateY(0) scale(1);}}
  .pop-badge{position:absolute; top:15px; left:15px; background:rgba(255,255,255,.94);
    color:var(--ink); border-radius:999px; padding:7px 15px; font-size:12px;
    font-weight:900; box-shadow:0 4px 14px rgba(0,0,0,.25); opacity:0;
    transform:scale(.6); animation:pi .5s .12s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes pi{to{opacity:1; transform:scale(1);}}
  .pop-tap{position:absolute; bottom:9px; left:0; right:0; text-align:center;
    font-size:10.5px; color:rgba(255,255,255,.55); font-weight:700;}
  .pop-bar{position:absolute; top:0; left:0; height:5px; width:0; z-index:2;
    background:linear-gradient(90deg,#2f8fd6,#7fd0f5);}
  .pop-card.full .pop-bar{background:linear-gradient(90deg,#f0a83c,#ffd98a);}
  .pop.show .pop-bar{animation:bg 4.4s linear forwards;}
  @keyframes bg{from{width:0;} to{width:100%;}}
  .conf{position:fixed; width:9px; height:14px; top:-24px; opacity:.95; z-index:201;
    animation:fl linear forwards;}
  @keyframes fl{to{transform:translateY(118vh) rotate(780deg); opacity:0;}}

  .omi{position:fixed; inset:0; z-index:300; display:flex; align-items:center;
    justify-content:center; padding:16px; background:rgba(20,40,60,0);
    backdrop-filter:blur(0); transition:background .4s, backdrop-filter .4s;}
  .omi.show{background:rgba(20,40,60,.7); backdrop-filter:blur(8px);}
  .omi-card{width:100%; max-width:360px; border-radius:26px; overflow:hidden;
    background:linear-gradient(170deg,#fffdf7,#fff6ec 45%,#ffeede);
    box-shadow:0 26px 70px rgba(10,30,50,.45); transform:translateY(40px) scale(.86);
    opacity:0; transition:transform .5s cubic-bezier(.16,1.32,.36,1), opacity .32s;}
  .omi.show .omi-card{transform:translateY(0) scale(1); opacity:1;}
  .omi-top{background:linear-gradient(135deg,#ff9db0,#ffb37a); padding:16px 18px 14px;
    text-align:center; color:#fff; position:relative;}
  .omi-top::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background:radial-gradient(circle at 10px -2px, transparent 9px, #fffdf7 10px);
    background-size:20px 14px;}
  .omi-ttl{font-size:15px; font-weight:900; letter-spacing:.16em;}
  .omi-date{font-size:10.5px; opacity:.92; margin-top:2px; font-weight:700;}
  .omi-draw{padding:30px 20px; text-align:center;}
  .omi-box{width:104px; height:132px; margin:0 auto 16px; position:relative;
    background:linear-gradient(160deg,#ff8fa6,#ff7089); border-radius:14px;
    box-shadow:0 10px 24px rgba(255,120,145,.4); animation:wb 1.5s ease-in-out infinite;
    display:flex; align-items:center; justify-content:center;}
  @keyframes wb{0%,100%{transform:rotate(-4deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-6px);}}
  .omi-box span{font-size:38px;}
  .omi-box::before{content:""; position:absolute; top:-9px; left:50%;
    transform:translateX(-50%); width:34px; height:12px; background:#f2d38a;
    border-radius:5px;}
  .omi-lead{font-size:14px; color:#8a6a52; margin-bottom:15px; font-weight:800;}
  .omi-btn{background:linear-gradient(135deg,#ff8fa6,#ffa579); border:none; color:#fff;
    font-size:16px; font-weight:900; padding:14px 40px; border-radius:999px;
    box-shadow:0 8px 20px rgba(255,130,150,.45);}
  .omi-res{padding:20px; text-align:center;}
  .omi-luck{font-size:44px; font-weight:900; letter-spacing:.1em;
    background:linear-gradient(135deg,#f2913f,#e2607b); -webkit-background-clip:text;
    background-clip:text; color:transparent; opacity:0; transform:scale(.5);
    animation:li .6s .05s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes li{to{opacity:1; transform:scale(1);}}
  .omi-word{font-size:12.5px; color:#8a6a52; margin:7px 0 15px; font-weight:800;
    opacity:0; animation:fu .5s .3s forwards;}
  @keyframes fu{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .omi-rows{display:flex; flex-direction:column; gap:9px; margin-bottom:14px;}
  .omi-row{display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.78);
    border-radius:12px; padding:10px 13px; opacity:0; animation:fu .45s forwards;}
  .omi-row:nth-child(1){animation-delay:.4s;}
  .omi-row:nth-child(2){animation-delay:.5s;}
  .omi-row:nth-child(3){animation-delay:.6s;}
  .omi-ico{font-size:18px;}
  .omi-lbl{font-size:13px; color:#7c6250; font-weight:900; width:56px; text-align:left;}
  .omi-stars{margin-left:auto; font-size:15px;}
  .omi-star-on{color:#f5a623;} .omi-star-off{color:#e5d9cc;}
  .omi-item{background:linear-gradient(135deg,#fff3e2,#ffe9f0); border:1.5px dashed #f0b39a;
    border-radius:14px; padding:13px; opacity:0; animation:fu .5s .72s forwards;}
  .omi-item-l{font-size:10.5px; color:#b08a72; letter-spacing:.1em; font-weight:900;}
  .omi-item-v{font-size:18px; font-weight:900; color:#d2683f; margin-top:4px;}
  .omi-close{display:block; width:100%; margin-top:14px; background:none; border:none;
    color:#a9927f; font-size:13px; padding:8px; font-weight:800; opacity:0;
    animation:fu .5s .85s forwards;}

  @media (max-width:560px){
    .cal-cell{min-height:74px; padding:4px 3px;}

    .ev-chip.done{opacity:.3;}

    .cell-dots{gap:2px;}
    .md i{width:5px; height:5px;}
    .md b{font-size:8.5px;}
  }
  @media (max-width:359px){
    .col-head img{width:38px; height:38px;}
    .card .ct{font-size:11.5px;}
  }

function fmt(dt){
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
function dateStr(d){ return fmt(new Date(YEAR, MONTH, d)); }
function isCurrentMonth(){ return today.getFullYear()===YEAR && today.getMonth()===MONTH; }
function todayDate(){ return isCurrentMonth() ? today.getDate() : -1; }

async function init(){
  refreshMonthVars();
  const { data: mem, error } = await sb.from("members").select("*").order("sort_order");
  if(error){ showError(error); return; }
  members = mem;
  renderTop();
  await loadMonth();
  maybeShowOmikuji();
}
function showError(e){
  document.getElementById("app").innerHTML =
    `<div class="status">読み込みに失敗しました<br>${e.message||""}</div>`;
}

async function loadMonth(){
  const dFrom = new Date(YEAR, MONTH, 0), dTo = new Date(YEAR, MONTH+1, 2);
  const [t, r] = await Promise.all([
    sb.from("tasks").select("*").gte("task_date",fmt(dFrom)).lte("task_date",fmt(dTo)).order("sort_order"),
    sb.from("daily_records").select("*").gte("record_date",fmt(dFrom)).lte("record_date",fmt(dTo))
  ]);
  if(t.error){ showError(t.error); return; }
  tasks = t.data || []; records = r.data || [];
  await seedKyosuke();
  renderTop(); render();
}

async function seedKyosuke(){
  const existing = new Set(tasks.filter(x=>x.member_id==="kyosuke").map(x=>x.task_date));
  const rows = [];
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const ds = dateStr(d);
    if(existing.has(ds)) continue;
    DEFAULT_TASKS_KYOSUKE.forEach((dt,i)=>{
      rows.push({member_id:"kyosuke", task_date:ds, category:dt.cat, text:dt.text,
        sort_order:i, start_time:dt.st, end_time:dt.et});
    });
  }
  if(!rows.length) return;
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if(!error) tasks = tasks.concat(data);
}

/* ===== データ取得 ===== */
function isMorningTask(t){ return !!(t.start_time && t.start_time < MORNING_END); }
function isRoutine(t){
  if(t.routine) return true;                       // 毎日・毎週で入れたもの
  if(t.member_id !== "kyosuke") return false;
  if((t.sort_order||0) >= 900) return false;
  return DEFAULT_TASKS_KYOSUKE.some(x=>x.text === t.text);
}
function tasksForDs(memberId, ds){
  let dt = tasks.filter(t=>t.member_id===memberId && t.task_date===ds);
  if(hasMoney(memberId)){
    const p = new Date(ds+"T00:00:00"); p.setDate(p.getDate()-1);
    const pr = records.find(x=>x.member_id===memberId && x.record_date===fmt(p));
    if(pr && pr.ramen_shift) dt = dt.filter(t=>!isMorningTask(t));
  }
  return dt;
}
function tasksFor(memberId, d, ds){ return tasksForDs(memberId, ds || dateStr(d)); }
function eventsOf(memberId, d, ds){
  return tasksForDs(memberId, ds).filter(t=>!isRoutine(t)).sort(sortByTime);
}
function sortByTime(a,b){
  const av = a.start_time || "99:99", bv = b.start_time || "99:99";
  if(av !== bv) return av < bv ? -1 : 1;
  return (a.sort_order||0) - (b.sort_order||0);
}

/* ================= ボード（メイン画面） ================= */
function renderBoard(){
  const bd = boardDate();
  const ds = fmt(bd);

  const cols = members.map(m=>{
    const dt = tasksForDs(m.id, ds).slice().sort(sortByTime);
    const done = dt.filter(isDone).length;
    const allDone = dt.length>0 && done===dt.length;

    let body = "";
    if(dt.length === 0){
      body = `<div class="col-empty">予定<br>なし</div>`;
    } else if(allDone){
      body = `<div class="col-clear"><span class="em">🎉</span>全て<br>完了！</div>`;
      body += dt.map(t=>cardHtml(t, m)).join("");
    } else {
      const groups = [
        {l:"朝",   i:"🌅", f:t=>t.start_time && t.start_time < "12:00"},
        {l:"昼",   i:"☀️", f:t=>t.start_time && t.start_time >= "12:00" && t.start_time < "17:00"},
        {l:"夜",   i:"🌙", f:t=>t.start_time && t.start_time >= "17:00"},
        {l:"時間未定",i:"🕐", f:t=>!t.start_time}
      ];
      groups.forEach(g=>{
        const list = dt.filter(g.f);
        if(!list.length) return;
        body += `<div class="slot"><div class="slot-l"><i>${g.i}</i>${g.l}</div>`;
        body += list.map(t=>cardHtml(t, m)).join("");
        body += `</div>`;
      });
    }

    return `<div class="col ${COLCLS[m.id]||''} ${allDone?'done':''}">
      <div class="col-head">
        <img src="${IMG[m.id]}" alt="">
        <div class="col-name">${esc(m.name)}</div>
        <div class="col-badge ${allDone?'ok':''}">${dt.length===0?'—':(allDone?'完了':'のこり'+(dt.length-done))}</div>
      </div>
      <div class="col-body">${body}</div>
    </div>`;
  }).join("");

  const label = boardOffset===0 ? "今日やること" : "明日の予定";
  document.getElementById("app").innerHTML = `
    <div class="board">
      <div class="board-ttl"><h2>${label}</h2><span>タップで完了</span></div>
      <div class="cols">${cols}</div>
    </div>
    <div class="foot">家族みんなで共有中 🐈</div>`;
}

function cardHtml(t, m){
  const c = t.member_id==="kyosuke" ? "var(--c-me)"
          : t.member_id==="mother"  ? "var(--c-mom)" : "var(--c-sis)";
  const tm = t.start_time ? t.start_time.slice(0,5) + (t.end_time? "–"+t.end_time.slice(0,5) : "") : "";
  const cls = t.skipped ? "rest" : (t.done ? "fin" : "");

// カレンダー表示のオン・オフ
async function toggleCalShow(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const now = isRoutine(t);
  t.routine = !now;   // 表示する→routine=false、隠す→routine=true
  closeSheet(); renderTop(); render();
  await sb.from("tasks").update({routine:t.routine}).eq("id",id);
}

async function actDone(id, val){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const before = celebCheck(t, "before");
  t.done = val; if(val) t.skipped = false;
  closeSheet(); renderTop(); render();
  await sb.from("tasks").update({done:t.done, skipped:t.skipped}).eq("id",id);
  if(val) celebCheck(t, "after", before);
}
async function actSkip(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const before = celebCheck(t, "before");
  t.skipped = !t.skipped; if(t.skipped) t.done = false;
  closeSheet(); renderTop(); render();
  await sb.from("tasks").update({done:t.done, skipped:t.skipped}).eq("id",id);
  if(t.skipped) celebCheck(t, "after", before);
}
async function askDel(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  if((t.sort_order||0) < 900){ actDel(id); return; }  // 定型タスクは単独削除

  const { data } = await sb.from("tasks").select("id,task_date")
    .eq("member_id", t.member_id).eq("text", t.text).gte("sort_order", 900);
  const same = data || [];
  const future = same.filter(x=>x.task_date >= t.task_date);
  const d = new Date(t.task_date+"T00:00:00");

  if(same.length <= 1){ actDel(id); return; }

  openSheet(`
    <button class="sh-back" onclick="openDetail('${id}')">‹ 戻る</button>
    <div class="sh-q">「${esc(t.text)}」を削除</div>
    <div class="det-s">同じ予定が ${same.length}日分 入っています</div>
    <div class="det-btns">
      <button class="det-b undone" onclick="actDel('${id}')">
        この日だけ削除（${d.getMonth()+1}/${d.getDate()}）
      </button>
      <button class="det-b rest" onclick="delBulk('${id}','future')">
        この日以降を全部削除（${future.length}日分）
      </button>
      <button class="det-b del" style="background:#fdecea;border:2px solid #f5c6c0"
        onclick="delBulk('${id}','all')">
        すべて削除（${same.length}日分）
      </button>
      <button class="sh-btn sub" onclick="openDetail('${id}')">キャンセル</button>
    </div>`);
}

async function delBulk(id, mode){
  const t = tasks.find(x=>x.id===id); if(!t) return;

  // 画面に出ていない月のぶんも含めて、DBから対象を数える
  let q = sb.from("tasks").select("id")
    .eq("member_id", t.member_id).eq("text", t.text).gte("sort_order", 900);
  if(mode === "future") q = q.gte("task_date", t.task_date);
  const { data, error } = await q;
  if(error){ alert("削除できませんでした"); return; }
  const ids = (data||[]).map(x=>x.id);
  if(!ids.length) return;
  if(!confirm(`${ids.length}日分の「${t.text}」を削除します。よろしいですか？`)) return;

  tasks = tasks.filter(x=>!ids.includes(x.id));
  closeSheet(); renderTop(); render();
  for(let i=0;i<ids.length;i+=100){
    await sb.from("tasks").delete().in("id", ids.slice(i,i+100));
  }
  alert(`${ids.length}日分を削除しました`);
}

async function actDel(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  tasks = tasks.filter(x=>x.id!==id);
  closeSheet(); renderTop(); render();
  await sb.from("tasks").delete().eq("id",id);
}

/* 半分・全部のお祝い判定 */
function celebCheck(t, phase, before){
  const ds = t.task_date;
  const dt = tasksForDs(t.member_id, ds);
  const total = dt.length, done = dt.filter(isDone).length;
  if(phase === "before") return {total, done};
  if(total === 0) return;
  const half = Math.ceil(total/2);
  const d = Number(ds.slice(8,10));
  if(done === total) setTimeout(()=>showPopFor("full", d, t.member_id), 240);
  else if(before && before.done < half && done >= half)
    setTimeout(()=>showPopFor("half", d, t.member_id), 240);
}

        onclick="${onPick}('${String(x).padStart(2,'0')}:${mi||'00'}')">${x}</button>`).join("")}
    </div>
    ${h!==null?`<div class="tp-m">
      ${MINS.map(x=>`<button class="tp-b m ${mi===x?'on':''}"
        onclick="${onPick}('${String(h).padStart(2,'0')}:${x}')">${x}分</button>`).join("")}

  </div>`;
}

  editState = {

    st: t.start_time ? t.start_time.slice(0,5) : null,
    et: t.end_time ? t.end_time.slice(0,5) : null,

  };
  // 開始時刻がプリセットと一致すれば時間帯として扱う

function edKeepInputs(){
  const tx = document.getElementById("edText");
  if(tx && tx.value.trim()) editState.text = tx.value.trim();
}
function edSet(field, value){ edKeepInputs(); editState[field] = value; editDraw(); }
function edSetText(v){ if(v.trim()) editState.text = v.trim(); }
function edShiftDate(diff){
  edKeepInputs();
  const d = new Date(editState.date+"T00:00:00");
  d.setDate(d.getDate()+diff);
  editState.date = fmt(d);
  editDraw();
}
function edSlot(k){
  edKeepInputs();
  editState.slot = k; editState.st = null; editState.et = null;
  editDraw();
}
function edTime(){
  edKeepInputs();
  editState.st = document.getElementById("edSt").value || null;
  editState.et = document.getElementById("edEt").value || null;
  if(editState.st) editState.slot = null;
  editDraw();
}
function edRep(r){
  edKeepInputs();
  editState.repeat = r;
  if(r !== "range") editState.until = null;
  if(['daily','weekly','weekday'].includes(r) && !editState.repUntil){
    editState.repUntil = untilOptions(editState.date)[0].date;
  }
  editDraw();
}
function edRepUntil(v){ edKeepInputs(); if(v) editState.repUntil = v; editDraw(); }
function edUntil(v){ edKeepInputs(); if(v) editState.until = v; editDraw(); }

function edClearTime(){
  edKeepInputs();
  editState.st = null; editState.et = null; editState.slot = "any";
  editDraw();
}

async function saveEdit(){
  edKeepInputs();
  const e = editState;
  const t = tasks.find(x=>x.id===e.id);
  if(!t) return;
  if(!e.text){ alert("内容を入力してください"); return; }

  const slot = TIMESLOTS.find(x=>x.k===e.slot);
  const st = e.st || (slot ? slot.st : null);
  const et = e.st ? e.et : null;

  // この予定そのものを更新
  t.member_id = e.member; t.text = e.text; t.task_date = e.date;
  t.start_time = st; t.end_time = et;
  closeSheet(); renderTop(); render();
  await sb.from("tasks").update({
    member_id:t.member_id, text:t.text, task_date:t.task_date,
    start_time:t.start_time, end_time:t.end_time
  }).eq("id", e.id);

  // 繰り返し・連日が選ばれていれば、ほかの日にも追加
  if(e.repeat !== "once"){
    let list;
    if(e.repeat === "range"){
      if(!e.until){ alert("終了日を選んでください"); return; }
      list = rangeDays(e.date, e.until);
    } else {
      list = repeatDates(new Date(e.date+"T00:00:00"), e.repeat, e.repUntil);
    }
    list = list.filter(ds => ds !== e.date);
    if(list.length){
      const isRep = ['daily','weekly','weekday'].includes(e.repeat);
      const rows = list.map(ds=>({
        member_id:e.member, task_date:ds, category:"other",
        text:e.text, sort_order:999, start_time:st, end_time:et,
        routine: isRep
      }));
      const { data, error } = await sb.from("tasks").insert(rows).select();
      if(!error){
        tasks = tasks.concat(data);
        renderTop(); render();
        alert(`他の ${list.length}日 にも追加しました`);
      }
    }
  }
}

function pickDate(ds){ addState.date = ds; stepWhen(); }
function pickSlot(k){ addState.slot = k; addState.st = null; addState.et = null; stepWhen(); }
function setSt(v){
  addState.st = v;
  if(!v) addState.et = null;
  if(v) addState.slot = null;
  stepWhen();
}
function setEt(v){ addState.et = v; stepWhen(); }
function pickRep(r){
  addState.repeat = r;
  if(r !== "range") addState.until = null;
  if(['daily','weekly','weekday'].includes(r) && !addState.repUntil){
    addState.repUntil = untilOptions(addState.date)[0].date;  // 既定は今月末
  }
  stepWhen();
}
function pickRepUntil(v){ if(v) addState.repUntil = v; stepWhen(); }
function pickUntil(v){ if(v) addState.until = v; stepWhen(); }
function fmtJp(ds){
  const d = new Date(ds+"T00:00:00");
  return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
}
function rangeDays(from, to){
  const out = [];
  const a = new Date(from+"T00:00:00"), b = new Date(to+"T00:00:00");
  if(b < a) return [fmt(a)];
  for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)) out.push(fmt(new Date(d)));
  return out;
}

async function saveAdd(){
  const a = addState;
  if(!a.member || !a.text){ alert("誰の・何をするかを選んでください"); return; }
  const slot = TIMESLOTS.find(s=>s.k===a.slot);
  const st = a.st || (slot ? slot.st : null);
  const et = a.st ? a.et : null;

  const base = new Date(a.date+"T00:00:00");
  let dayList;
  if(a.repeat === "range"){
    if(!a.until){ alert("終了日を選んでください"); return; }
    dayList = rangeDays(a.date, a.until);
  } else {
    dayList = repeatDates(base, a.repeat, a.repUntil);
  }
  const isRep = ['daily','weekly','weekday'].includes(a.repeat);
  const rows = dayList.map(ds=>({
    member_id:a.member, task_date:ds, category:"other",
    text:a.text, sort_order:999, start_time:st, end_time:et,
    routine: isRep
  }));
  closeSheet();
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if(!error){
    tasks = tasks.concat(data);
    renderTop(); render();
    if(dayList.length>1) alert(`「${a.text}」を ${dayList.length}日分 追加しました`);
  } else {
    alert("保存できませんでした");
  }
}
function repeatDates(base, rep, untilStr){
  if(rep==="once") return [fmt(base)];
  const last = untilStr ? new Date(untilStr+"T00:00:00")
    : new Date(base.getFullYear(), base.getMonth()+1, 0);
  const twd = base.getDay();
  const out = [];
  const d = new Date(base);
  let guard = 0;
  while(d <= last && guard < 800){
    const wd = d.getDay();
    if(rep==="daily") out.push(fmt(d));
    else if(rep==="weekly" && wd===twd) out.push(fmt(d));
    else if(rep==="weekday" && wd>=1 && wd<=5) out.push(fmt(d));
    d.setDate(d.getDate()+1);
    guard++;
  }
  return out;
}

// 「いつまで」の候補
function untilOptions(fromStr){
  const f = new Date(fromStr+"T00:00:00");
  const eom = new Date(f.getFullYear(), f.getMonth()+1, 0);
  const add = n => { const x = new Date(f); x.setMonth(x.getMonth()+n); return x; };
  return [
    {k:"eom",  label:"今月末まで",  date:fmt(eom)},
    {k:"m3",   label:"3ヶ月後まで", date:fmt(add(3))},
    {k:"m6",   label:"半年後まで",  date:fmt(add(6))},
    {k:"y1",   label:"1年後まで",   date:fmt(add(12))}
  ];
}

    let dots = "", cTot=0, cDone=0;
    members.forEach(m=>{
      const dt = tasksForDs(m.id, ds);
      cTot += dt.length; cDone += dt.filter(isDone).length;
      const rem = dt.filter(t=>!isDone(t)).length;
      const c = m.id==="kyosuke" ? "var(--c-me)" : m.id==="mother" ? "var(--c-mom)" : "var(--c-sis)";

function daysLeft(){
  if(isCurrentMonth()) return DAYS_IN_MONTH - today.getDate() + 1;
  const cur = new Date(today.getFullYear(), today.getMonth(), 1);
  return new Date(YEAR,MONTH,1) > cur ? DAYS_IN_MONTH : 0;

function perDay(remain, left){
  if(remain<=0) return 0;
  if(left<=0) return remain;
  return Math.ceil(remain/left);
}

  </div>`;

  // 家族の達成率
  const mDone={}, mTot={};
  members.forEach(m=>{ mDone[m.id]=0; mTot[m.id]=0; });
  tasks.forEach(t=>{
    if(!t.task_date.startsWith(`${YEAR}-${String(MONTH+1).padStart(2,"0")}`)) return;
    if(mTot[t.member_id]===undefined) return;
    mTot[t.member_id]++; if(isDone(t)) mDone[t.member_id]++;
  });
  const allDone = Object.values(mDone).reduce((a,b)=>a+b,0);
  const allTot = Object.values(mTot).reduce((a,b)=>a+b,0);

  html += `<div class="mine-sec">
    <div class="mine-ttl">🏠 家族の達成 <small>今月</small></div>
    <div class="stat-grid">
      <div class="stat"><div class="l">家族のタスク完了</div><div class="v">${allDone} / ${allTot}</div></div>
      <div class="stat"><div class="l">達成率</div>
        <div class="v" style="color:var(--green)">${allTot?Math.round(allDone/allTot*100):0}%</div></div>
    </div>
    <div style="margin-top:14px">`;
  members.forEach(m=>{
    const c = m.id==="kyosuke" ? "var(--c-me)" : m.id==="mother" ? "var(--c-mom)" : "var(--c-sis)";
    const p = mTot[m.id] ? Math.round(mDone[m.id]/mTot[m.id]*100) : 0;
    html += `<div class="member-row">
      <img src="${IMG[m.id]}" class="member-face" style="border-color:${c}">
      <div class="member-name">${esc(m.name)}</div>
      <div class="member-bar-wrap"><div class="member-bar" style="width:${p}%;background:${c}"></div></div>
      <div class="member-val">${mDone[m.id]}/${mTot[m.id]}（${p}%）</div></div>`;
  });
  html += `</div></div>`;

  // 日別売上グラフ
  const dailyYen = [];
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const r = getRecordDs("kyosuke", dateStr(d));
    dailyYen.push(r.uber_sales + r.eigyou_self*EIGYOU_SELF_YEN + r.eigyou_team*EIGYOU_TEAM_YEN);
  }
  const maxY = Math.max(...dailyYen,1);
  html += `<div class="mine-sec">
    <div class="mine-ttl">📊 日別 売上 <small>最大 ¥${maxY.toLocaleString()}</small></div>
    <div class="bar-chart">`;
  dailyYen.forEach((y,i)=>{
    html += `<div class="bar-col"><div class="bar" style="height:${Math.round(y/maxY*100)}%;background:var(--accent)"></div>
      <div class="bar-label">${i+1}</div></div>`;
  });
  html += `</div></div><div class="foot">この画面は自分用です</div>`;

  document.getElementById("app").innerHTML = html;
  loadBulkList();
}
function remainHtml(goal, actual){
  const r = goal-actual;
  return r<=0 ? `<div class="sub remain achieved">達成 +¥${Math.abs(r).toLocaleString()}</div>`
              : `<div class="sub remain">残り ¥${r.toLocaleString()}</div>`;
}
function setRecDate(v){
  if(!v) return;
  recDate = v;
  const y = Number(v.slice(0,4)), m = Number(v.slice(5,7))-1;
  if(y!==YEAR || m!==MONTH){
    YEAR = y; MONTH = m; refreshMonthVars();
    loadMonth().then(()=>{ view = "mine"; render(); });
    return;
  }
  renderMine();
}
function shiftRec(diff){
  const d = new Date(recDate+"T00:00:00");
  d.setDate(d.getDate()+diff);
  setRecDate(fmt(d));
}

// 繰り返し予定の一覧を出して、種類ごとに一括削除
async function loadBulkList(){
  const el = document.getElementById("bulkList");
  if(!el) return;
  const { data, error } = await sb.from("tasks")
    .select("member_id,text,task_date").gte("sort_order", 900);
  if(error){ el.innerHTML = `<div class="rec-hint">読み込めませんでした</div>`; return; }

  const map = {};
  (data||[]).forEach(t=>{
    const k = t.member_id + "\u0000" + t.text;
    if(!map[k]) map[k] = {member_id:t.member_id, text:t.text, n:0, from:t.task_date, to:t.task_date};
    map[k].n++;
    if(t.task_date < map[k].from) map[k].from = t.task_date;
    if(t.task_date > map[k].to)   map[k].to   = t.task_date;
  });
  const list = Object.values(map).filter(x=>x.n >= 2).sort((a,b)=>b.n-a.n);
  if(!list.length){
    el.innerHTML = `<div class="rec-hint">くり返しの予定はありません</div>`;
    return;
  }
  el.innerHTML = list.map(x=>{
    const m = members.find(y=>y.id===x.member_id) || {};
    return `<div class="bulk-row">
      <img src="${IMG[x.member_id]}" class="bulk-face">
      <div class="bulk-info">
        <div class="bulk-t">${esc(x.text)}</div>
        <div class="bulk-s">${esc(m.name||"")}・${x.n}日分（${x.from.slice(5).replace("-","/")}〜${x.to.slice(5).replace("-","/")}）</div>
      </div>
      <button class="bulk-del" onclick="delAllOf('${x.member_id}','${esc(x.text).replace(/'/g,"\\'")}',${x.n})">削除</button>
    </div>`;
  }).join("");
}

async function delAllOf(memberId, text, n){
  const m = members.find(y=>y.id===memberId) || {};
  if(!confirm(`${m.name||""}の「${text}」を ${n}日分すべて削除します。よろしいですか？`)) return;
  const { data } = await sb.from("tasks").select("id")
    .eq("member_id", memberId).eq("text", text).gte("sort_order", 900);
  const ids = (data||[]).map(x=>x.id);
  for(let i=0;i<ids.length;i+=100){
    await sb.from("tasks").delete().in("id", ids.slice(i,i+100));
  }
  tasks = tasks.filter(x=>!ids.includes(x.id));
  renderTop(); renderMine();
  alert(`${ids.length}日分を削除しました`);
}

async function saveRecord(ds, field, value){
  const v = parseInt(value)||0;
  let r = records.find(x=>x.member_id==="kyosuke" && x.record_date===ds);
  if(!r){ r = {member_id:"kyosuke", record_date:ds, uber_sales:0, eigyou_self:0,
    eigyou_team:0, ramen_shift:false}; records.push(r); }
  r[field] = v;
  renderMine();
  await sb.from("daily_records").upsert({
    member_id:"kyosuke", record_date:ds, uber_sales:r.uber_sales,
    eigyou_self:r.eigyou_self, eigyou_team:r.eigyou_team, ramen_shift:!!r.ramen_shift
  }, {onConflict:"member_id,record_date"});
}
async function toggleRamen(ds){
  let r = records.find(x=>x.member_id==="kyosuke" && x.record_date===ds);
  if(!r){ r = {member_id:"kyosuke", record_date:ds, uber_sales:0, eigyou_self:0,
    eigyou_team:0, ramen_shift:false}; records.push(r); }
  r.ramen_shift = !r.ramen_shift;
  renderMine(); renderTop();
  await sb.from("daily_records").upsert({
    member_id:"kyosuke", record_date:ds, uber_sales:r.uber_sales,
    eigyou_self:r.eigyou_self, eigyou_team:r.eigyou_team, ramen_shift:r.ramen_shift
  }, {onConflict:"member_id,record_date"});
}

const HALF_MSG = ["半分きたよ！","いい調子！","折り返しだよ","もうちょっと！"];

];
const FULL_MSG = ["今日もお疲れ様！","今日も頑張ったね！","今日も一日お疲れ様！","全部やりきったね！"];
const FULL_SUB = [
  "今日のぶん、ぜんぶ終わったよ。ゆっくり休んで。",
  "きちんとやりきったね。今日はもう休んでいい日。",
  "毎日の積み重ねが一番すごい。今日もありがとう。",
  "よく頑張りました。明日もいい一日になりますように。"
];
const pick = a => a[Math.floor(Math.random()*a.length)];

function showPopFor(kind, d, memberId){
  const isFull = kind === "full";
  const photo = isFull ? pick(FAMS) : pick(CATS);
  const who = callOf(memberId);
  const title = `${who}、${isFull ? pick(FULL_MSG) : pick(HALF_MSG)}`;
  const sub = isFull ? pick(FULL_SUB) : pick(HALF_SUB);
  const badge = isFull ? `${who}・${MONTH+1}/${d} 完了` : `${who}・半分クリア`;

  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = `<div class="pop-card ${isFull?'full':'half'}">
      <div class="pop-bar"></div>
      <img class="pop-photo" src="${photo}" alt="">
      <div class="pop-badge">${badge}</div>
      <div class="pop-body">
        <div class="pop-title">${title}</div>
        <div class="pop-sub">${sub}</div>
        <div class="pop-tap">タップで閉じる</div>
      </div>
    </div>`;
  document.body.appendChild(el);
  if(isFull) confetti(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  const close = ()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 460); };
  setTimeout(close, isFull ? 4800 : 4000);
  el.style.pointerEvents = "auto";
  el.addEventListener("click", close);
}
function confetti(host){
  const colors = ["#2f8fd6","#2eb489","#f0a83c","#8a6fd6","#e2705f","#7fd0f5"];
  for(let i=0;i<55;i++){
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = Math.random()*100 + "%";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.9 + Math.random()*1.6) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    if(Math.random()>0.5) c.style.borderRadius = "50%";
    host.appendChild(c);
  }
}

  {name:"中吉", w:18, word:"流れは good。丁寧にいけば結果がついてくる。"},

  {name:"凶",   w:10, word:"無理は禁物。ひとつ終わらせるだけで十分。"}
];
const LUCKY_ITEMS = [
  "白いタオル","温かいお茶","青いペン","窓際の席","甘いもの","黒い靴下",
  "レモン","メモ帳","朝の散歩","炭酸水","丸いもの","赤い小物",
  "コーヒー","ハンカチ","好きな音楽","早起き","おにぎり","観葉植物",
  "帽子","水色のもの","深呼吸","チョコレート","時計","鏡を見ること",
  "笑うこと","猫を撫でること","味噌汁","新しい靴下","日光を浴びること",
  "アイスコーヒー","星の模様","バナナ"
];
function seedRand(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return ()=>{ h = Math.imul(h ^ (h>>>15), 2246822507); h ^= h>>>13; return ((h>>>0)%10000)/10000; };
}
function drawFortune(key){
  const r = seedRand(key);
  const total = LUCKS.reduce((a,b)=>a+b.w,0);
  let x = r()*total, luck = LUCKS[LUCKS.length-1];
  for(const l of LUCKS){ if(x<l.w){ luck=l; break; } x-=l.w; }
  const st = ()=> 1 + Math.floor(r()*5);
  return { luck, money:st(), work:st(), total:st(),
    item: LUCKY_ITEMS[Math.floor(r()*LUCKY_ITEMS.length)] };
}
function starHtml(n){
  let h=""; for(let i=1;i<=5;i++) h += `<span class="${i<=n?'omi-star-on':'omi-star-off'}">★</span>`;
  return h;
}
function omiKey(){ const t=new Date(); return `${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`; }
function maybeShowOmikuji(){
  const t = new Date();
  if(t.getHours() < 7) return;
  const key = "omikuji_" + omiKey();
  try{ if(localStorage.getItem(key)) return; }catch(e){ return; }
  showOmikuji(key);
}
function showOmikuji(key){
  const t = new Date();
  const el = document.createElement("div");
  el.className = "omi";
  el.innerHTML = `<div class="omi-card">
    <div class="omi-top">
      <div class="omi-ttl">今日のおみくじ</div>
      <div class="omi-date">${t.getFullYear()}.${t.getMonth()+1}.${t.getDate()}</div>
    </div>
    <div class="omi-draw" id="omiDraw">
      <div class="omi-box"><span>🎴</span></div>
      <div class="omi-lead">今日はどんな一日かな？<br>おみくじを引いてみよう</div>
      <button class="omi-btn" onclick="doDraw('${key}')">引く</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  window.__omiEl = el;
  requestAnimationFrame(()=>el.classList.add("show"));
}
function doDraw(key){
  const el = window.__omiEl; if(!el) return;
  try{ localStorage.setItem(key,"1"); }catch(e){}
  const f = drawFortune(key);
  el.querySelector("#omiDraw").outerHTML = `
    <div class="omi-res">
      <div class="omi-luck">${f.luck.name}</div>
      <div class="omi-word">${f.luck.word}</div>
      <div class="omi-rows">
        <div class="omi-row"><span class="omi-ico">🌈</span><span class="omi-lbl">総合運</span>
          <span class="omi-stars">${starHtml(f.total)}</span></div>
        <div class="omi-row"><span class="omi-ico">💰</span><span class="omi-lbl">金運</span>
          <span class="omi-stars">${starHtml(f.money)}</span></div>
        <div class="omi-row"><span class="omi-ico">💼</span><span class="omi-lbl">仕事運</span>
          <span class="omi-stars">${starHtml(f.work)}</span></div>
      </div>
      <div class="omi-item">
        <div class="omi-item-l">LUCKY ITEM</div>
        <div class="omi-item-v">${f.item}</div>
      </div>
      <button class="omi-close" onclick="closeOmi()">閉じて今日を始める</button>
    </div>`;
  if(f.luck.name === "大吉") confetti(el);
}
function closeOmi(){
  const el = window.__omiEl; if(!el) return;
  el.classList.remove("show");
  setTimeout(()=>{ el.remove(); window.__omiEl = null; }, 420);
}
