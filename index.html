<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#12181c; --panel:#1a2126; --panel2:#212a30; --line:#2b363c;
    --ink:#eef2f0; --sub:#93a3a6; --gold:#d4a94c; --green:#4caf7d; --red:#d97066;
    --uber:#4a90d9; --eigyou:#9b7fd4; --daily:#6b7a80; --nomigo:#c9603f;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:60px;}

  /* ===== ヘッダー ===== */
  .banner{
    width:100%; max-width:760px; margin:0 auto; display:block;
    position:relative;
  }
  .banner img{
    width:100%; display:block; object-fit:contain;
  }
  .banner::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg, transparent, var(--bg));
    pointer-events:none;
  }
  .head-inner{max-width:760px; margin:0 auto; padding:0 14px 14px;}
  .title-row{display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin:-6px 0 14px;}
  h1{font-size:19px; margin:0; font-weight:700;}
  h1 .accent{color:var(--gold);}

  /* 月切り替え */
  .month-nav{display:flex; align-items:center; gap:6px;}
  .month-nav button{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav select{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:6px 8px; font-size:13px; font-weight:600;
  }

  /* メンバー切り替え */
  .member-tabs{display:flex; gap:8px; margin-bottom:12px;}
  .member-tab{
    flex:1; background:var(--panel); border:1.5px solid var(--line);
    border-radius:12px; padding:9px 4px 8px; text-align:center;
    font-size:13px; color:var(--sub); cursor:pointer; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .member-tab img{
    width:42px; height:42px; border-radius:50%; object-fit:cover;
    border:2px solid var(--line);
  }
  .member-tab.active{background:var(--panel2); color:var(--ink);}
  .member-tab.active[data-m="kyosuke"]{border-color:var(--gold);}
  .member-tab.active[data-m="kyosuke"] img{border-color:var(--gold);}
  .member-tab.active[data-m="kyosuke"] .mn{color:var(--gold);}
  .member-tab.active[data-m="sister"]{border-color:var(--eigyou);}
  .member-tab.active[data-m="sister"] img{border-color:var(--eigyou);}
  .member-tab.active[data-m="sister"] .mn{color:var(--eigyou);}
  .member-tab.active[data-m="mother"]{border-color:var(--uber);}
  .member-tab.active[data-m="mother"] img{border-color:var(--uber);}
  .member-tab.active[data-m="mother"] .mn{color:var(--uber);}
  .member-tab .mrem{font-size:10.5px; color:var(--sub); font-weight:400;}

  /* ビュー切り替え */
  .view-tabs{display:flex; gap:6px; font-size:13px;}
  .view-tab{
    flex:1; padding:8px 0; border-radius:9px; background:var(--panel);
    border:1px solid var(--line); color:var(--sub); cursor:pointer; text-align:center;
  }
  .view-tab.active{background:var(--gold); border-color:var(--gold);
    color:#1a1305; font-weight:700;}

  main{padding:16px 14px 40px; max-width:760px; margin:0 auto;}

  /* 目標カード */
  .goal-strip{display:flex; gap:9px; margin-bottom:16px;}
  .goal-card{flex:1 1 0; min-width:0; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:11px 12px;}
  .goal-card .label{font-size:10.5px; color:var(--sub); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .goal-card .value{font-size:16px; font-weight:700; margin-top:3px;}
  .goal-card.uber .value{color:var(--uber);}
  .goal-card.eigyou .value{color:var(--eigyou);}
  .goal-card.total .value{color:var(--gold);}
  .goal-card .sub{font-size:10.5px; color:var(--sub); margin-top:2px;}
  .goal-card .sub.remain{color:var(--red); font-weight:600;}
  .goal-card .sub.remain.achieved{color:var(--green);}

  /* 日リスト */
  .day-block{background:var(--panel); border:1px solid var(--line);
    border-radius:14px; margin-bottom:9px; overflow:hidden;}
  .day-head{display:flex; align-items:center; justify-content:space-between;
    padding:12px 15px; cursor:pointer; user-select:none;}
  .day-head .left{display:flex; align-items:center; gap:10px;}
  .day-num{font-size:17px; font-weight:700; width:30px; text-align:center;}
  .day-num.today{color:var(--gold);}
  .day-weekday{font-size:11px; color:var(--sub); width:14px;}
  .day-weekday.sun{color:var(--red);} .day-weekday.sat{color:var(--uber);}
  .day-meta{font-size:11.5px; color:var(--sub);}
  .day-meta b{color:var(--ink); font-weight:600;}
  .day-meta .alldone{color:var(--green); font-weight:600;}
  .chevron{color:var(--sub); font-size:12px; transition:transform .2s;}
  .day-block.open .chevron{transform:rotate(90deg);}
  .day-progress-bar{height:4px; background:var(--line); border-radius:2px;
    margin-top:7px; width:130px; overflow:hidden;}
  .day-progress-fill{height:100%; background:var(--green); transition:width .25s;}
  .day-body{display:none; padding:2px 15px 15px; border-top:1px solid var(--line);}
  .day-block.open .day-body{display:block;}

  .section-label{font-size:11px; letter-spacing:.05em; color:var(--sub);
    margin:13px 0 5px; display:flex; align-items:center; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .dot.uber{background:var(--uber);} .dot.eigyou{background:var(--eigyou);}
  .dot.daily{background:var(--daily);} .dot.other{background:var(--gold);}
  .dot.nomigo{background:var(--nomigo);}

  .task{display:flex; align-items:flex-start; gap:10px; padding:8px 2px;
    border-bottom:1px solid #ffffff08;}
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{appearance:none; -webkit-appearance:none;
    width:21px; height:21px; min-width:21px; border:1.5px solid var(--sub);
    border-radius:6px; margin-top:1px; cursor:pointer; position:relative; background:transparent;}
  .task input[type=checkbox]:checked{background:var(--green); border-color:var(--green);}
  .task input[type=checkbox]:checked::after{content:"✓"; position:absolute;
    top:50%; left:50%; transform:translate(-50%,-58%); color:#0c1a12;
    font-size:13px; font-weight:700;}
  .task label{font-size:14.5px; line-height:1.5; flex:1; cursor:pointer;}
  .task.done label{color:var(--sub); text-decoration:line-through;
    text-decoration-color:#ffffff30;}
  .task .del{background:none; border:none; color:#5a686e; font-size:17px;
    cursor:pointer; padding:0 4px; line-height:1;}

  .record-row{margin:8px 0 4px;}
  .record-row.two-col{display:flex; gap:10px;}
  .record-row.two-col > div{flex:1;}
  .record-label{font-size:12px; color:var(--sub); display:block; margin-bottom:4px;}
  .record-input{width:100%; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; color:var(--ink); font-size:14px;}
  .record-hint{font-size:11.5px; color:var(--sub); margin-top:6px;}

  .add-row{display:flex; gap:7px; margin-top:11px;}
  .add-row input{flex:1; min-width:0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    color:var(--ink); font-size:13.5px;}
  .add-row select{background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:9px 6px; color:var(--ink); font-size:12.5px;}
  .add-row button{background:var(--gold); border:none; color:#1a1305;
    font-weight:700; border-radius:8px; padding:9px 14px; font-size:13.5px; cursor:pointer;}
  .repeat-row{margin-top:7px;}
  .repeat-row select{width:100%; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    color:var(--sub); font-size:12.5px;}

  /* ===== ポップアップ演出 ===== */
  .pop{
    position:fixed; inset:0; z-index:200; display:flex;
    align-items:center; justify-content:center; padding:22px;
    background:rgba(8,12,14,0); backdrop-filter:blur(0px);
    transition:background .35s, backdrop-filter .35s;
    pointer-events:none;
  }
  .pop.show{background:rgba(8,12,14,.72); backdrop-filter:blur(6px);}
  .pop-card{
    position:relative; width:100%; max-width:330px;
    background:var(--panel); border-radius:22px; overflow:hidden;
    border:2px solid var(--gold);
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 6px rgba(212,169,76,.10);
    transform:translateY(40px) scale(.82) rotate(-3deg); opacity:0;
    transition:transform .5s cubic-bezier(.18,1.3,.4,1), opacity .35s;
  }
  .pop.show .pop-card{transform:translateY(0) scale(1) rotate(0); opacity:1;}
  .pop-card.half{border-color:#68c2a0; box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 6px rgba(104,194,160,.10);}
  .pop-photo{width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    animation:kenburns 6s ease-out forwards;}
  @keyframes kenburns{
    from{transform:scale(1.14);}
    to{transform:scale(1);}
  }
  .pop-body{
    position:absolute; left:0; right:0; bottom:0; padding:34px 20px 20px;
    background:linear-gradient(180deg, transparent, rgba(12,16,19,.72) 38%, rgba(12,16,19,.95));
    text-align:center;
  }
  .pop-title{
    font-size:23px; font-weight:800; letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.9); margin-bottom:5px;
    opacity:0; transform:translateY(14px);
    animation:riseIn .5s .22s forwards;
  }
  .pop-card.half .pop-title{color:#8fe0bd;}
  .pop-card.full .pop-title{color:var(--gold);}
  .pop-sub{
    font-size:12.5px; color:#d3dcde; line-height:1.6;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
    opacity:0; transform:translateY(14px);
    animation:riseIn .5s .36s forwards;
  }
  @keyframes riseIn{ to{opacity:1; transform:translateY(0);} }
  .pop-badge{
    position:absolute; top:13px; left:13px;
    background:rgba(10,14,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16); border-radius:999px;
    padding:6px 13px; font-size:11.5px; font-weight:700; letter-spacing:.03em;
    opacity:0; transform:scale(.7);
    animation:popIn .45s .1s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  @keyframes popIn{ to{opacity:1; transform:scale(1);} }
  .pop-bar{
    position:absolute; top:0; left:0; height:4px; width:0;
    background:linear-gradient(90deg, var(--gold), #f0d089);
  }
  .pop.show .pop-bar{ animation:barGo 3.6s linear forwards; }
  .pop-card.half .pop-bar{background:linear-gradient(90deg,#4caf7d,#8fe0bd);}
  @keyframes barGo{ from{width:0;} to{width:100%;} }

  /* 紙吹雪 */
  .conf{position:fixed; width:8px; height:13px; top:-20px; opacity:.95;
    animation:fall linear forwards; z-index:201;}
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(760deg); opacity:0; }
  }

  /* カレンダー */
  .cal-wrap{background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:13px 11px; margin-bottom:13px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-head{font-size:10.5px; color:var(--sub); text-align:center; padding:3px 0;}
  .cal-head.sun{color:var(--red);} .cal-head.sat{color:var(--uber);}
  .cal-cell{aspect-ratio:1/1.2; background:var(--panel2);
    border:1.5px solid transparent; border-radius:9px; padding:4px 2px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center;}
  .cal-cell.empty{background:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--gold);}
  .cal-cell.sel{background:#2e3b42; border-color:var(--sub);}
  .cal-cell .cd{font-size:12px; font-weight:600;}
  .cal-cell.today .cd{color:var(--gold);}
  .mini-list{margin-top:3px; width:100%; display:flex; flex-direction:column; gap:1px;}
  .mini-row{display:flex; align-items:center; justify-content:center; gap:3px;}
  .mini-dot{width:5px; height:5px; border-radius:50%; flex-shrink:0;}
  .mini-val{font-size:9.5px; font-weight:700; line-height:1.35; color:var(--ink);}
  .mini-val.ok{color:var(--green);}
  .mini-val.off{color:#48555b;}
  .cal-legend{display:flex; gap:11px; justify-content:center; flex-wrap:wrap;
    margin-top:11px; font-size:10.5px; color:var(--sub);}
  .cal-legend span{display:flex; align-items:center; gap:4px;}
  .legend-face{width:17px; height:17px; border-radius:50%; object-fit:cover;
    border:1.5px solid var(--line);}
  .cal-detail{background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:16px;}
  .cal-detail-title{font-size:15px; font-weight:700; margin:0 0 3px;}
  .cal-detail-sub{font-size:11.5px; color:var(--sub); margin-bottom:8px;}

  /* 可視化 */
  .viz-section{background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:13px;}
  .viz-title{font-size:14px; font-weight:700; margin:0 0 13px;}
  .viz-sub{font-size:11.5px; color:var(--sub); font-weight:400; margin-left:6px;}
  .member-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .member-face{width:26px; height:26px; border-radius:50%; object-fit:cover;
    border:1.5px solid var(--line); flex-shrink:0;}
  .member-name{font-size:12.5px; width:36px; flex-shrink:0;}
  .member-bar-wrap{flex:1; height:20px; background:var(--panel2);
    border-radius:5px; overflow:hidden;}
  .member-bar{height:100%; border-radius:5px; transition:width .3s;}
  .member-val{font-size:12px; width:86px; text-align:right; flex-shrink:0;}
  .bar-chart{display:flex; align-items:flex-end; gap:2px; height:110px;
    padding-top:8px;}
  .bar-col{flex:1; min-width:0; display:flex; flex-direction:column;
    justify-content:flex-end; align-items:center; height:100%;}
  .bar{width:100%; border-radius:2px 2px 0 0; min-height:1px;}
  .bar-label{font-size:7.5px; color:var(--sub); margin-top:3px;}
  .stat-grid{display:flex; gap:9px; flex-wrap:wrap;}
  .stat{flex:1 1 44%; background:var(--panel2); border-radius:10px; padding:11px 12px;}
  .stat .l{font-size:10.5px; color:var(--sub);}
  .stat .v{font-size:17px; font-weight:700; margin-top:3px;}

  .status{text-align:center; color:var(--sub); font-size:12.5px; padding:26px;}
  .footer-note{text-align:center; color:var(--sub); font-size:11px;
    margin-top:18px; line-height:1.7;}
</style>
</head>
<body>

<div class="banner"><img id="bannerImg" alt=""></div>

<div class="head-inner">
  <div class="title-row">
    <h1>タスク<span class="accent">管理</span></h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <select id="monthSelect" onchange="jumpMonth(this.value)"></select>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="member-tabs" id="memberTabs"></div>
  <div class="view-tabs">
    <button class="view-tab active" data-view="list" onclick="switchView('list')">リスト</button>
    <button class="view-tab" data-view="cal" onclick="switchView('cal')">カレンダー</button>
    <button class="view-tab" data-view="viz" onclick="switchView('viz')">可視化</button>
  </div>
</div>

<main id="app"><div class="status">読み込み中...</div></main>

<div class="footer-note">
  家族全員のデータが自動で共有されます。
</div>

let members = [], currentMember = "kyosuke", currentView = "list";
let tasks = [], records = [], openDays = new Set(), calSelectedDay = null;

const today = new Date();
let YEAR = today.getFullYear(), MONTH = today.getMonth();
let DAYS_IN_MONTH = 0;
const WD = ["日","月","火","水","木","金","土"];

function refreshMonthVars(){
  DAYS_IN_MONTH = new Date(YEAR, MONTH+1, 0).getDate();
}
function dateStr(d){
  return YEAR + "-" + String(MONTH+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}
function isCurrentMonth(){
  return today.getFullYear()===YEAR && today.getMonth()===MONTH;
}
function todayDate(){ return isCurrentMonth() ? today.getDate() : -1; }

async function init(){
  document.getElementById("bannerImg").src = IMG.header;
  refreshMonthVars();
  buildMonthOptions();
  const { data: mem, error } = await sb.from("members").select("*").order("sort_order");
  if(error){ showError(error); return; }
  members = mem;
  renderMemberTabs();
  await loadMonth();
}

function buildMonthOptions(){
  const sel = document.getElementById("monthSelect");
  let html = "";
  const base = new Date(today.getFullYear(), today.getMonth(), 1);
  for(let i=-12; i<=12; i++){
    const dt = new Date(base.getFullYear(), base.getMonth()+i, 1);
    const v = dt.getFullYear()+"-"+dt.getMonth();
    html += `<option value="${v}">${dt.getFullYear()}年${dt.getMonth()+1}月</option>`;
  }
  sel.innerHTML = html;
  sel.value = YEAR+"-"+MONTH;
}

function changeMonth(diff){
  const dt = new Date(YEAR, MONTH+diff, 1);
  YEAR = dt.getFullYear(); MONTH = dt.getMonth();
  document.getElementById("monthSelect").value = YEAR+"-"+MONTH;
  afterMonthChange();
}
function jumpMonth(v){
  const [y,m] = v.split("-").map(Number);
  YEAR = y; MONTH = m;
  afterMonthChange();
}
async function afterMonthChange(){
  refreshMonthVars();
  openDays.clear(); calSelectedDay = null;
  document.getElementById("app").innerHTML = '<div class="status">読み込み中...</div>';
  await loadMonth();
  window.scrollTo(0,0);
}

async function loadMonth(){
  const from = dateStr(1), to = dateStr(DAYS_IN_MONTH);
  const [t, r] = await Promise.all([
    sb.from("tasks").select("*").gte("task_date",from).lte("task_date",to).order("sort_order"),
    sb.from("daily_records").select("*").gte("record_date",from).lte("record_date",to)
  ]);
  if(t.error){ showError(t.error); return; }
  tasks = t.data || [];
  records = r.data || [];
  await seedKyosuke();
  renderMemberTabs();
  render();
}

// 享祐のデフォルトタスクを今月分だけ自動作成（未作成の日のみ）
async function seedKyosuke(){
  const existing = new Set(tasks.filter(x=>x.member_id==="kyosuke").map(x=>x.task_date));
  const rows = [];
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const ds = dateStr(d);
    if(existing.has(ds)) continue;
    DEFAULT_TASKS_KYOSUKE.forEach((dt,i)=>{
      rows.push({member_id:"kyosuke", task_date:ds, category:dt.cat, text:dt.text, sort_order:i});
    });
  }
  if(rows.length === 0) return;
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if(!error) tasks = tasks.concat(data);
}

function showError(e){
  document.getElementById("app").innerHTML =
    `<div class="status">読み込みに失敗しました。<br>${e.message||""}</div>`;
}

function renderMemberTabs(){
  const el = document.getElementById("memberTabs");
  const tdate = todayDate();
  el.innerHTML = members.map(m=>{
    let rem = "";
    if(tdate > 0){
      const dt = tasks.filter(t=>t.member_id===m.id && t.task_date===dateStr(tdate));
      const r = dt.filter(t=>!t.done).length;
      rem = dt.length===0 ? "今日 —" : (r===0 ? "今日 完了" : "今日 残り"+r);
    }
    return `<div class="member-tab ${m.id===currentMember?'active':''}" data-m="${m.id}"
      onclick="switchMember('${m.id}')">
      <img src="${IMG[m.id]}" alt="">
      <span class="mn">${m.name}</span>
      <span class="mrem">${rem}</span>
    </div>`;
  }).join("");
}

function switchMember(id){
  currentMember = id;
  openDays.clear();
  renderMemberTabs();
  render();
  window.scrollTo(0,0);
}
function switchView(v){
  currentView = v;
  document.querySelectorAll(".view-tab").forEach(b=>
    b.classList.toggle("active", b.dataset.view===v));
  render();
  window.scrollTo(0,0);
}
function render(){
  if(currentView==="list") renderList();
  else if(currentView==="cal") renderCalendar();
  else renderViz();
}

// ===== リスト =====
function renderList(){
  let html = hasMoney(currentMember) ? renderGoalStrip() : "";
  const td = todayDate();

  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const ds = dateStr(d);
    const dt = tasks.filter(t=>t.member_id===currentMember && t.task_date===ds);
    const rec = getRecord(currentMember, ds);
    const done = dt.filter(t=>t.done).length, total = dt.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const wdi = new Date(YEAR,MONTH,d).getDay();
    const wdCls = wdi===0?"sun":(wdi===6?"sat":"");

    let meta = total===0 ? "タスクなし"
      : (done===total ? `<span class="alldone">✓ 全${total}件 完了</span>` : `${done}/${total} 完了`);
    if(hasMoney(currentMember)){
      const yen = rec.uber_sales + rec.eigyou_self*EIGYOU_SELF_YEN + rec.eigyou_team*EIGYOU_TEAM_YEN;
      meta += ` ／ 売上 <b>¥${yen.toLocaleString()}</b>`;
    }

    html += `<div class="day-block ${openDays.has(d)?'open':''}" id="day-${d}">
      <div class="day-head" onclick="toggleDay(${d})">
        <div class="left">
          <div class="day-num ${d===td?'today':''}">${d}</div>
          <div class="day-weekday ${wdCls}">${WD[wdi]}</div>
          <div>
            <div class="day-meta">${meta}</div>
            <div class="day-progress-bar"><div class="day-progress-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
        <div class="chevron">▶</div>
      </div>
      <div class="day-body">
        ${renderDayTasks(d, ds, dt, rec)}
        ${renderAddRow(d)}
      </div>
    </div>`;
  }
  document.getElementById("app").innerHTML = html;
}

function renderAddRow(d){
  const wd = WD[new Date(YEAR,MONTH,d).getDay()];
  const cats = hasMoney(currentMember)
    ? ["daily","nomigo","uber","eigyou","other"]
    : CAT_SIMPLE;
  const opts = cats.map(c=>`<option value="${c}">${CAT_META[c].label}</option>`).join("");
  return `<div class="add-row">
      <select id="cat-${d}">${opts}</select>
      <input type="text" id="new-${d}" placeholder="タスクを追加...">
      <button onclick="addTask(${d})">追加</button>
    </div>
    <div class="repeat-row">
      <select id="rep-${d}">
        <option value="once">この日だけ</option>
        <option value="daily">毎日（今月の残り全部）</option>
        <option value="weekly">毎週${wd}曜（今月の残り）</option>
        <option value="weekday">平日のみ（今月の残り）</option>
      </select>
    </div>`;
}

function renderGoalStrip(){
  const g = GOALS.kyosuke;
  let uber=0,self=0,team=0;
  records.filter(r=>r.member_id==="kyosuke").forEach(r=>{
    uber+=r.uber_sales; self+=r.eigyou_self; team+=r.eigyou_team;
  });
  const ey = self*EIGYOU_SELF_YEN + team*EIGYOU_TEAM_YEN;
  return `<div class="goal-strip">
    <div class="goal-card uber"><div class="label">Uber営業代行</div>
      <div class="value">¥${g.uber.toLocaleString()}</div>
      <div class="sub">実績 ¥${uber.toLocaleString()}</div>${remainHtml(g.uber,uber)}</div>
    <div class="goal-card eigyou"><div class="label">営業代行</div>
      <div class="value">¥${g.eigyou.toLocaleString()}</div>
      <div class="sub">${self+team}件・¥${ey.toLocaleString()}</div>${remainHtml(g.eigyou,ey)}</div>
    <div class="goal-card total"><div class="label">合計目標</div>
      <div class="value">¥${(g.uber+g.eigyou).toLocaleString()}</div>
      <div class="sub">実績 ¥${(uber+ey).toLocaleString()}</div>${remainHtml(g.uber+g.eigyou,uber+ey)}</div>
  </div>`;
}
function remainHtml(goal, actual){
  const r = goal-actual;
  return r<=0
    ? `<div class="sub remain achieved">達成 +¥${Math.abs(r).toLocaleString()}</div>`
    : `<div class="sub remain">残り ¥${r.toLocaleString()}</div>`;
}

function renderDayTasks(d, ds, dt, rec){
  let html = "";
  const cats = hasMoney(currentMember)
    ? ["daily","nomigo","uber","eigyou","other"] : CAT_SIMPLE;
  cats.forEach(cat=>{
    const ct = dt.filter(t=>t.category===cat);
    const needRec = hasMoney(currentMember) && (cat==="uber"||cat==="eigyou");
    if(ct.length===0 && !needRec) return;
    html += `<div class="section-label"><span class="dot ${CAT_META[cat].dot}"></span>${CAT_META[cat].label}</div>`;
    ct.forEach(t=>{
      html += `<div class="task ${t.done?'done':''}">
        <input type="checkbox" id="t-${t.id}" ${t.done?'checked':''} onchange="toggleTask('${t.id}',${d})">
        <label for="t-${t.id}">${esc(t.text)}</label>
        <button class="del" onclick="delTask('${t.id}')">×</button>
      </div>`;
    });
    if(needRec && cat==="uber"){
      html += `<div class="record-row">
        <label class="record-label">当日のUber売上（円）</label>
        <input type="number" inputmode="numeric" class="record-input" value="${rec.uber_sales||''}"
          placeholder="例：5000" onchange="saveRecord('${ds}','uber_sales',this.value)"></div>`;
    }
    if(needRec && cat==="eigyou"){
      const yen = rec.eigyou_self*EIGYOU_SELF_YEN + rec.eigyou_team*EIGYOU_TEAM_YEN;
      html += `<div class="record-row two-col">
        <div><label class="record-label">自分の成約数</label>
          <input type="number" inputmode="numeric" class="record-input" value="${rec.eigyou_self||''}"
            placeholder="0" onchange="saveRecord('${ds}','eigyou_self',this.value)"></div>
        <div><label class="record-label">下の人の成約数</label>
          <input type="number" inputmode="numeric" class="record-input" value="${rec.eigyou_team||''}"
            placeholder="0" onchange="saveRecord('${ds}','eigyou_team',this.value)"></div>
      </div><div class="record-hint">当日の営業代行 見込み：¥${yen.toLocaleString()}</div>`;
    }
  });
  return html;
}

function getRecord(id, ds){
  return records.find(x=>x.member_id===id && x.record_date===ds)
    || {uber_sales:0, eigyou_self:0, eigyou_team:0};
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function toggleDay(d){
  if(openDays.has(d)) openDays.delete(d); else openDays.add(d);
  document.getElementById("day-"+d).classList.toggle("open");
}

async function toggleTask(id, d){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const ds = dateStr(d);
  const before = tasks.filter(x=>x.member_id===currentMember && x.task_date===ds);
  const beforeDone = before.filter(x=>x.done).length;
  const was = t.done;
  t.done = !t.done;
  render(); renderMemberTabs();
  await sb.from("tasks").update({done:t.done}).eq("id",id);

  if(was) return; // チェックを外した時は出さない
  const after = tasks.filter(x=>x.member_id===currentMember && x.task_date===ds);
  const total = after.length;
  const afterDone = after.filter(x=>x.done).length;
  if(total === 0) return;

  const half = Math.ceil(total/2);
  if(afterDone === total){
    setTimeout(()=>showPop("full", d), 260);
  } else if(beforeDone < half && afterDone >= half){
    setTimeout(()=>showPop("half", d), 260);
  }
}

const HALF_MSG = [
  "半分まできた！あと少し頑張ろう",
  "折り返し地点！いい調子",
  "半分クリア！この調子でいこう",
  "ここまで来たらあと少し"
];
const FULL_MSG = [
  "今日も頑張った！",
  "今日も完璧！お疲れ様",
  "全部やりきった！",
  "今日も一日お疲れ様！"
];
const pick = a => a[Math.floor(Math.random()*a.length)];

function showPop(kind, d){
  const name = (members.find(m=>m.id===currentMember)||{}).name || "";
  const isFull = kind === "full";
  const photo = isFull ? pick(FAMS) : pick(CATS);
  const title = isFull ? pick(FULL_MSG) : pick(HALF_MSG);
  const badge = isFull ? "🎉 ALL CLEAR" : "🐈 HALF WAY";
  const sub = isFull
    ? `${MONTH+1}月${d}日・${name}さん、今日のタスク全部完了です。家族みんな見てるよ。`
    : `${MONTH+1}月${d}日・${name}さん、半分終わりました。ラストスパート！`;

  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = `<div class="pop-card ${isFull?'full':'half'}">
      <div class="pop-bar"></div>
      <img class="pop-photo" src="${photo}" alt="">
      <div class="pop-badge">${badge}</div>
      <div class="pop-body">
        <div class="pop-title">${title}</div>
        <div class="pop-sub">${sub}</div>
      </div>
    </div>`;
  document.body.appendChild(el);
  if(isFull) confetti(el);
  requestAnimationFrame(()=>el.classList.add("show"));

  const close = ()=>{
    el.classList.remove("show");
    setTimeout(()=>el.remove(), 420);
  };
  setTimeout(close, isFull ? 4000 : 3200);
  el.style.pointerEvents = "auto";
  el.addEventListener("click", close);
}

function confetti(host){
  const colors = ["#d4a94c","#4caf7d","#4a90d9","#9b7fd4","#d97066","#f0d089"];
  for(let i=0;i<40;i++){
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = Math.random()*100 + "%";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.9 + Math.random()*1.6) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    if(Math.random()>0.5) c.style.borderRadius = "50%";
    host.appendChild(c);
  }
}

async function delTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  render(); renderMemberTabs();
  await sb.from("tasks").delete().eq("id",id);
}

async function addTask(d){
  const input = document.getElementById("new-"+d);
  const cat = document.getElementById("cat-"+d).value;
  const rep = document.getElementById("rep-"+d).value;
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  const days = repeatDays(d, rep);
  const rows = days.map(day=>({member_id:currentMember, task_date:dateStr(day),
    category:cat, text, sort_order:999}));
  const { data, error } = await sb.from("tasks").insert(rows).select();
  if(!error){
    tasks = tasks.concat(data);
    render(); renderMemberTabs();
    if(rep!=="once") alert(`「${text}」を${days.length}日分に追加しました。`);
  }
}

function repeatDays(start, rep){
  if(rep==="once") return [start];
  const twd = new Date(YEAR,MONTH,start).getDay();
  const out = [];
  for(let d=start; d<=DAYS_IN_MONTH; d++){
    const wd = new Date(YEAR,MONTH,d).getDay();
    if(rep==="daily") out.push(d);
    else if(rep==="weekly" && wd===twd) out.push(d);
    else if(rep==="weekday" && wd>=1 && wd<=5) out.push(d);
  }
  return out;
}

async function saveRecord(ds, field, value){
  const v = parseInt(value)||0;
  let r = records.find(x=>x.member_id===currentMember && x.record_date===ds);
  if(!r){
    r = {member_id:currentMember, record_date:ds, uber_sales:0, eigyou_self:0, eigyou_team:0};
    records.push(r);
  }
  r[field] = v;
  render();
  await sb.from("daily_records").upsert({
    member_id:currentMember, record_date:ds,
    uber_sales:r.uber_sales, eigyou_self:r.eigyou_self, eigyou_team:r.eigyou_team
  }, {onConflict:"member_id,record_date"});
}

// ===== カレンダー =====
function renderCalendar(){
  const firstWd = new Date(YEAR,MONTH,1).getDay();
  const td = todayDate();
  let html = `<div class="cal-wrap"><div class="cal-grid">`;
  WD.forEach((w,i)=>{
    html += `<div class="cal-head ${i===0?'sun':(i===6?'sat':'')}">${w}</div>`;
  });
  for(let i=0;i<firstWd;i++) html += `<div class="cal-cell empty"></div>`;

  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const ds = dateStr(d);
    let rows = "";
    members.forEach(m=>{
      const dt = tasks.filter(t=>t.member_id===m.id && t.task_date===ds);
      const rem = dt.filter(t=>!t.done).length;
      const cls = dt.length===0 ? "off" : (rem===0 ? "ok" : "");
      const val = dt.length===0 ? "–" : (rem===0 ? "✓" : rem);
      rows += `<div class="mini-row"><span class="mini-dot" style="background:${m.color}"></span><span class="mini-val ${cls}">${val}</span></div>`;
    });
    html += `<div class="cal-cell ${d===td?'today':''} ${calSelectedDay===d?'sel':''}"
      onclick="selectCalDay(${d})">
      <div class="cd">${d}</div><div class="mini-list">${rows}</div></div>`;
  }
  html += `</div><div class="cal-legend">` +
    members.map(m=>`<span><img src="${IMG[m.id]}" class="legend-face" style="border-color:${m.color}">${m.name}</span>`).join("") +
    `<span>数字＝残り件数</span></div></div>`;

  const sel = calSelectedDay || (td>0 ? td : 1);
  html += renderCalDetail(sel);
  document.getElementById("app").innerHTML = html;
}

function renderCalDetail(d){
  const ds = dateStr(d);
  const wd = WD[new Date(YEAR,MONTH,d).getDay()];
  const dt = tasks.filter(t=>t.member_id===currentMember && t.task_date===ds);
  const rec = getRecord(currentMember, ds);
  const done = dt.filter(t=>t.done).length;
  const name = (members.find(m=>m.id===currentMember)||{}).name||"";

  let html = `<div class="cal-detail">
    <div class="cal-detail-title">${MONTH+1}月${d}日（${wd}）　${name}</div>
    <div class="cal-detail-sub">${done}/${dt.length} 完了`;
  if(hasMoney(currentMember)){
    const yen = rec.uber_sales + rec.eigyou_self*EIGYOU_SELF_YEN + rec.eigyou_team*EIGYOU_TEAM_YEN;
    html += ` ／ 売上 ¥${yen.toLocaleString()}`;
  }
  html += `</div>`;
  html += dt.length===0
    ? `<div style="color:var(--sub);font-size:13px;padding:6px 0;">タスクはまだありません。</div>`
    : renderDayTasks(d, ds, dt, rec);
  html += renderAddRow(d) + `</div>`;
  return html;
}

function selectCalDay(d){ calSelectedDay = d; renderCalendar(); }

// ===== 可視化 =====
function renderViz(){
  const memberYen={}, memberDone={}, memberTotal={};
  members.forEach(m=>{ memberYen[m.id]=0; memberDone[m.id]=0; memberTotal[m.id]=0; });
  let totalYen = 0;
  records.forEach(r=>{
    if(!hasMoney(r.member_id)) return;
    const y = r.uber_sales + r.eigyou_self*EIGYOU_SELF_YEN + r.eigyou_team*EIGYOU_TEAM_YEN;
    memberYen[r.member_id] += y; totalYen += y;
  });
  tasks.forEach(t=>{
    if(memberTotal[t.member_id]===undefined) return;
    memberTotal[t.member_id]++;
    if(t.done) memberDone[t.member_id]++;
  });

  const goalTotal = GOALS.kyosuke.uber + GOALS.kyosuke.eigyou;
  const allDone = Object.values(memberDone).reduce((a,b)=>a+b,0);
  const allTotal = Object.values(memberTotal).reduce((a,b)=>a+b,0);

  const dailyYen=[], dailyDone=[];
  for(let d=1; d<=DAYS_IN_MONTH; d++){
    const ds = dateStr(d);
    const r = getRecord("kyosuke", ds);
    dailyYen.push(r.uber_sales + r.eigyou_self*EIGYOU_SELF_YEN + r.eigyou_team*EIGYOU_TEAM_YEN);
    dailyDone.push(tasks.filter(t=>t.task_date===ds && t.done).length);
  }
  const maxYen = Math.max(...dailyYen,1), maxDone = Math.max(...dailyDone,1);

  let html = `<div class="viz-section">
    <div class="viz-title">月間サマリー<span class="viz-sub">${YEAR}年${MONTH+1}月</span></div>
    <div class="stat-grid">
      <div class="stat"><div class="l">売上合計（享祐）</div>
        <div class="v" style="color:var(--gold)">¥${totalYen.toLocaleString()}</div></div>
      <div class="stat"><div class="l">目標まで残り</div>
        <div class="v" style="color:${totalYen>=goalTotal?'var(--green)':'var(--red)'}">
        ${totalYen>=goalTotal?'達成':'¥'+(goalTotal-totalYen).toLocaleString()}</div></div>
      <div class="stat"><div class="l">タスク完了（家族全体）</div>
        <div class="v">${allDone} / ${allTotal}</div></div>
      <div class="stat"><div class="l">達成率</div>
        <div class="v" style="color:var(--green)">${allTotal?Math.round(allDone/allTotal*100):0}%</div></div>
    </div></div>`;

  html += `<div class="viz-section"><div class="viz-title">メンバー別 タスク達成率</div>`;
  members.forEach(m=>{
    const tot = memberTotal[m.id], dn = memberDone[m.id];
    const pct = tot ? Math.round(dn/tot*100) : 0;
    html += `<div class="member-row">
      <img src="${IMG[m.id]}" class="member-face" style="border-color:${m.color}">
      <div class="member-name">${m.name}</div>
      <div class="member-bar-wrap"><div class="member-bar" style="width:${pct}%;background:${m.color}"></div></div>
      <div class="member-val">${dn}/${tot}（${pct}%）</div></div>`;
  });
  html += `</div>`;

  html += `<div class="viz-section">
    <div class="viz-title">日別 売上<span class="viz-sub">享祐・最大 ¥${maxYen.toLocaleString()}</span></div>
    <div class="bar-chart">`;
  dailyYen.forEach((y,i)=>{
    html += `<div class="bar-col"><div class="bar" style="height:${Math.round(y/maxYen*100)}%;background:var(--gold)"></div>
      <div class="bar-label">${i+1}</div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="viz-section">
    <div class="viz-title">日別 タスク完了数<span class="viz-sub">家族全体・最大 ${maxDone}件</span></div>
    <div class="bar-chart">`;
  dailyDone.forEach((c,i)=>{
    html += `<div class="bar-col"><div class="bar" style="height:${Math.round(c/maxDone*100)}%;background:var(--green)"></div>
      <div class="bar-label">${i+1}</div></div>`;
  });
  html += `</div></div>`;

  document.getElementById("app").innerHTML = html;
}
